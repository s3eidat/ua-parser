<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebApplication", "name": "User Agent Parser", "url": "https://s3eidat.github.io/ua-parser/", "description": "Decode any browser user agent. Free, private and runs 100% in your browser: no sign-up, no uploads.", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any (web browser)", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "image": "https://s3eidat.github.io/ua-parser/screenshot.png", "author": {"@type": "Person", "name": "s3eidat", "url": "https://github.com/s3eidat"}}</script>

<body data-tool="ua-parser">
<main class="s3-main">
  <section class="s3-hero">
    <h1>User Agent Parser</h1>
    <p>See what your browser says about itself, or paste user agent strings from your logs to find out which browsers, devices, bots and scripts they are.</p>
  </section>

  <section class="card stack">
    <div class="row between">
      <h2>Your browser</h2>
      <button class="btn small" id="copyMine"><svg class="i"><use href="#i-copy"/></svg>Copy user agent</button>
    </div>
    <div class="ua-mine" id="mine"></div>
    <code class="ua-raw" id="raw"></code>
    <div id="hints"></div>
  </section>

  <section class="card stack mt">
    <div class="row between">
      <h2>Parse user agents <small>one per line</small></h2>
      <div class="row">
        <button class="btn ghost small" id="sample">Sample</button>
        <label class="btn ghost small" id="open">Open log<input type="file" accept=".txt,.log,.csv,text/plain" hidden></label>
        <button class="btn ghost small" id="clear">Clear</button>
      </div>
    </div>
    <label class="field"><span class="sr">User agent strings</span>
      <textarea class="textarea" id="input" spellcheck="false" placeholder="Mozilla/5.0 (iPhone; CPU iPhone OS 17_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.4 Mobile/15E148 Safari/604.1"></textarea>
    </label>
    <div class="row between">
      <div class="row">
        <div class="seg" id="view" role="group" aria-label="Output">
          <button aria-pressed="true" data-v="table">Table</button>
          <button aria-pressed="false" data-v="json">JSON</button>
        </div>
        <span class="faint" id="summary"></span>
      </div>
      <div class="row">
        <button class="btn small" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy</button>
        <button class="btn small" id="save"><svg class="i"><use href="#i-download"/></svg><span id="ext">.csv</span></button>
      </div>
    </div>
    <div class="tbl-wrap ua-tbl" id="table"></div>
    <pre class="out ua-json" id="json" hidden></pre>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
